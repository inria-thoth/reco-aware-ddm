# @package _global_

defaults:
 - /models@models.pretrained_flow_x: xxs_flow_64
 - /models@models.pretrained_flow_y: xxs_flow_64
 - /models@models.kernel: direct_centerpixel
 - /loss@loss.aux_x: flow_matching
 - /loss@loss.aux_y: flow_matching
 - override /training: default
 - override /generation: flow

models:
  pretrained_flow_x:
    path: ${paths.out_path}/step1_parkinglot_clean/checkpoints/training-state-8388608.pt
  pretrained_flow_y:
    path: ${paths.out_path}/step1_parkinglot_noisy/checkpoints/training-state-8388608.pt
  kernel:
    type: direct_center
    factor: 1
    kernel_size: 13
    kernel_ch: 3
    num_psfs: [12, 16]
    padding: replicate
    initialization: random
    kernel_norm: softplus_sum_to_one
    noise_type: gaussian

dataset:
  device: cuda
  train:
    clean_path: ${paths.data}/parking_lot/parkinglot_5_6_center768.zip
    noisy_path: ${paths.data}/parking_lot/parkinglot_16.zip
    degradation:
      kind: none
    noise:
      kind: none
    patch_size: 64
    num_patches_per_image: 256
    patch_cache_size: 256
    cuda: True
    x_flip: False
    space_conditioning: True
    full_test: True
    need_clean: True
    need_noisy: True
  test:
    path: ${paths.data}/parking_lot/parkinglot_5_6_center768.zip
    degradation:
      kind: none
    noise:
      kind: none
    patch_size: 64
    num_patches_per_image: 256
    patch_cache_size: 256
    cuda: True
    x_flip: False
    space_conditioning: True
    full_test: True
    need_clean: True
    need_noisy: True

optim:
  aux_x:
    lr: 0.0001
  aux_y:
    lr: 0.0001
  kernel:
    lr: 0.003

loss:
  aux_x:
    diffusion:
      type: flowmatching
    n_accum_steps: 1
    name: flow_matching
  aux_y:
    diffusion:
      type: flowmatching
    n_accum_steps: 1
    name: flow_matching
  name: di_x_y
  n_accum_steps: 1
  n_inner_steps: 1
  lambda_dix: 1.0
  lambda_dix_warmup_steps: ${parse_nimg:"1Mi"}
  restorer:
    type: dpir
    sigma: 0.04
    grad_iters: 1

training:
  tensorboard: true
  batch_size: 32
  num_workers: 6
  max_val_batches: 1
  max_steps: ${parse_nimg:"15Mi"}
  report_every_steps: ${parse_nimg:"16Ki"}
  plot_every_steps: ${parse_nimg:"32Ki"}
  save_every_steps: ${parse_nimg:"1Mi"}
  save_first_step: false
  seed: 41

exp_name: diy_dix_pnp_step2_parkinglot_v1
