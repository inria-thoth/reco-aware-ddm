# @package _global_

defaults:
 - /models@models.flow: xxxs_flow_256
 - /dataset@dataset.train: ffhq_train
 - /dataset@dataset.test: ffhq_test
 - override /training: default
 - override /loss: flow_matching
 - override /generation: flow
 - override /dataset/degradation@dataset.train.degradation: chromatic_aberration_blur
 - override /dataset/noise@dataset.train.noise: gaussian
 - override /dataset/degradation@dataset.test.degradation: chromatic_aberration_blur
 - override /dataset/noise@dataset.test.noise: gaussian

dataset:
  device: cuda
  train:
    clean_path: ${paths.data}/ffhq/ffhq_256_tr_1k_clean.zip
    noisy_path: ${paths.data}/ffhq/ffhq_256_tr_1k_noisy.zip
    noise:
        kind: gaussian
        std: 0.02
    patch_size: 64
    num_patches_per_image: 256
    patch_cache_size: 2048
    x_flip: True
    space_conditioning: True
    full_test: True
    need_clean: True
    need_noisy: True
  test:
    path: ${paths.data}/ffhq/ffhq_256_val_clean.zip
    noise:
        kind: gaussian
        std: 0.02
    patch_size: 64
    num_patches_per_image: 256
    patch_cache_size: 2048
    x_flip: True
    space_conditioning: True
    full_test: True
    need_clean: True
    need_noisy: True

optim:
  lr: 0.01

loss:
  clean_images: False
  n_accum_steps: 8

ema:
  stds: [0.05]

training:
  tensorboard: true
  batch_size: 32
  max_val_batches: 1
  num_workers: 4
  max_steps: ${parse_nimg:"8Mi"}
  save_every_steps: ${parse_nimg:"1Mi"}
  plot_every_steps: ${parse_nimg:"128Ki"}
  report_every_steps: ${parse_nimg:"16Ki"}

exp_name: step1_ffhq256_chromab_patch
